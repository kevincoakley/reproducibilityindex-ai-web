<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="site-title"><a href="{{ url_for('pages.index') }}">{{ site_title }}</a></h1>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ url_for('pages.index') }}">🏠 Home</a> 
          📚
          {% for venue in venue_nav %}
            <a href="{{ url_for('pages.venue_years', venue=venue.venue) }}">{{ venue.venue }}</a>
          {% endfor %}
          <a href="{{ url_for('pages.countries') }}">🚩 Countries</a>
          <a href="{{ url_for('pages.institutions') }}">🏛️ Institutions</a>
          <a href="{{ url_for('pages.data') }}">💾 Data</a>
          <a href="{{ url_for('pages.methods') }}">💡 Methods</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-logos">
          <a href="https://www.ntnu.no/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='NTNU.png') }}" alt="NTNU" class="footer-logo">
          </a>
          <a href="https://www.sdsc.edu/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='SDSC.png') }}" alt="SDSC" class="footer-logo">
          </a>
          <a href="https://www.rwth-aachen.de/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='RWTH.png') }}" alt="RWTH" class="footer-logo">
          </a>
        </div>
        <span id="site-version">{{ web_version }}</span>
      </div>
    </footer>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.tooltip-wrap').forEach(function (wrap) {
          var tipEl = wrap.querySelector('.tooltip-text');
          if (!tipEl) return;
          tippy(wrap, {
            content: tipEl.innerHTML,
            allowHTML: true,
            interactive: true,
            theme: 'site',
            maxWidth: 352,
          });
          tipEl.style.display = 'none';
        });
      });
    </script>
  </body>
</html>
