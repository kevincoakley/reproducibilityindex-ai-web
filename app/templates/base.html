<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <link rel="stylesheet" href="https://unpkg.com/tippy.js@6/dist/tippy.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="site-title"><a href="{{ url_for('pages.index') }}">{{ site_title }}</a></h1>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ url_for('pages.index') }}">🏠 Home</a> 
          📚
          {% for venue in venue_nav %}
            <a href="{{ url_for('pages.venue_years', venue=venue.venue) }}">{{ venue.venue }}</a>
          {% endfor %}
          <a href="{{ url_for('pages.countries') }}">🚩 Countries</a>
          <a href="{{ url_for('pages.institutions') }}">🏛️ Institutions</a>
          <a href="{{ url_for('pages.data') }}">💾 Data</a>
          <a href="{{ url_for('pages.methods') }}">💡 Methods</a>
          <a href="{{ url_for('pages.about') }}">❓ About</a>
        </nav>
      </div>
    </header>

    <script>
      function buildChartLegend(chart, containerId) {
        const container = document.getElementById(containerId);
        if (!container) return;
        const type = chart.config.type;
        if (type === "pie" || type === "doughnut") {
          const labels = chart.data.labels || [];
          const bgColors = (chart.data.datasets[0] || {}).backgroundColor || [];
          labels.forEach((label, index) => {
            const color = Array.isArray(bgColors) ? bgColors[index] : bgColors;
            const item = document.createElement("span");
            item.className = "chart-legend-item";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = true;
            cb.id = `${containerId}-cb-${index}`;
            if (color) cb.style.setProperty("--swatch-color", color);
            const lbl = document.createElement("label");
            lbl.htmlFor = cb.id;
            lbl.textContent = label;
            cb.addEventListener("change", () => {
              chart.toggleDataVisibility(index);
              item.classList.toggle("is-hidden", !cb.checked);
              chart.update();
            });
            item.appendChild(cb);
            item.appendChild(lbl);
            container.appendChild(item);
          });
        } else {
          chart.data.datasets.forEach((dataset, index) => {
            const item = document.createElement("span");
            item.className = "chart-legend-item";
            const cb = document.createElement("input");
            cb.type = "checkbox";
            cb.checked = true;
            cb.id = `${containerId}-cb-${index}`;
            if (dataset.borderColor) cb.style.setProperty("--swatch-color", dataset.borderColor);
            const lbl = document.createElement("label");
            lbl.htmlFor = cb.id;
            lbl.textContent = dataset.label;
            cb.addEventListener("change", () => {
              chart.data.datasets[index].hidden = !cb.checked;
              item.classList.toggle("is-hidden", !cb.checked);
              chart.update();
            });
            item.appendChild(cb);
            item.appendChild(lbl);
            container.appendChild(item);
          });
        }
      }
    </script>

    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <div class="footer-logos">
          <a href="https://www.ntnu.no/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='NTNU.png') }}" alt="NTNU" class="footer-logo">
          </a>
          <a href="https://www.sdsc.edu/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='SDSC.png') }}" alt="SDSC" class="footer-logo">
          </a>
          <a href="https://www.rwth-aachen.de/" target="_blank" rel="noopener noreferrer">
            <img src="{{ url_for('static', filename='RWTH.png') }}" alt="RWTH" class="footer-logo">
          </a>
        </div>
        <span id="site-version">{{ web_version }}</span>
      </div>
    </footer>
    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.tooltip-wrap').forEach(function (wrap) {
          var tipEl = wrap.querySelector('.tooltip-text');
          if (!tipEl) return;
          tippy(wrap, {
            content: tipEl.innerHTML,
            allowHTML: true,
            interactive: true,
            theme: 'site',
            maxWidth: 352,
          });
          tipEl.style.display = 'none';
        });
      });
    </script>
  </body>
</html>
