<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ site_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
  </head>
  <body>
    <header class="site-header">
      <div class="container">
        <h1 class="site-title"><a href="{{ url_for('pages.index') }}">{{ site_title }}</a></h1>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="{{ url_for('pages.index') }}">🏠 Home</a> 
          📚
          {% for venue in venue_nav %}
            <a href="{{ url_for('pages.venue_years', venue=venue.venue) }}">{{ venue.venue }}</a>
          {% endfor %}
          <a href="{{ url_for('pages.countries') }}">🚩 Countries</a>
          <a href="{{ url_for('pages.institutions') }}">🏛️ Institutions</a>
          <a href="{{ url_for('pages.data') }}">💾 Data</a>
          <a href="{{ url_for('pages.methods') }}">💡 Methods</a>
        </nav>
      </div>
    </header>

    <main class="container page-content">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="container">
        <span id="site-version">{{ web_version }}</span>
      </div>
    </footer>
  </body>
</html>
